<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>vibe-arena — overlay OBS</title>
<style>
  body { margin:0; background:transparent; font:16px system-ui; display:flex; height:100vh; overflow:hidden; }
  /* OBS browser source: set this page as a browser source; background is transparent so it can sit on the stream, or capture the canvas fullscreen. */
  canvas { flex:1 1 0;min-width:0;width:0; height:100%; background:#0b0b0f; }
  #side { width:300px;flex:0 0 300px; background:#101018ee; color:#eee; display:flex; flex-direction:column; }
  #side h3 { margin:10px 12px 4px; color:#8ef; font-size:14px; }
  #feed { flex:1; overflow-y:auto; padding:0 12px; font-size:13px; line-height:1.5; }
  #feed .chat { color:#ccc; } #feed .system { color:#8ef; }
  #players { padding:8px 12px; border-top:1px solid #222; font-size:13px; color:#9a9; max-height:120px; overflow-y:auto; }
  #fund { padding:8px 12px; border-top:1px solid #222; font-size:13px; color:#ffd166; }
  #err { color:#f88; padding:0 12px; font-size:12px; }
  #live-credits a { color:#8ef; }
#live-credits { flex-shrink:0; }
#live-credits details>div { max-height:140px;overflow:auto; }
#feed { min-height:0; }
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<div id="side">
  <h3 id="game">vibe-arena</h3>
  <div id="err"></div>
  <div id="feed"></div>
  <div id="fund"></div>
  <div id="players"></div>
  <div id="live-credits" hidden style="padding:8px 12px;font-size:12px"></div>
  <a href="/privacy.html" style="padding:6px 12px;color:#9bd;font:12px system-ui">Privacy · operator details pending</a>
</div>
<script type="module">
import { connect } from './client.js';
import {attachLiveCredits} from './live-credits.js';
const credits=attachLiveCredits(document.getElementById('live-credits'));
const feed = document.getElementById('feed');
connect({
  spectator: true,
  canvas: document.getElementById('cv'),
  onCredits: publication => credits.update(publication),
  onWelcome: m => { (m.recent||[]).forEach(addFeed); },
  onFeed: addFeed,
  onPlayers: (p, game, err, fund) => {
    credits.matchGame(game);
    if (game) document.getElementById('game').textContent = game.name;
    document.getElementById('err').textContent = err || '';
    document.getElementById('players').replaceChildren(...p.map(x=>{const line=document.createElement('div');line.textContent='▸ '+x.name;return line;}));
    if (fund) {
      const pct = fund.goal > 0 ? Math.min(100, Math.round(fund.balance / fund.goal * 100)) : 0;
      document.getElementById('fund').innerHTML =
        `Demo build credits ${fund.balance.toFixed(2)} / ${fund.goal.toFixed(2)} (${pct}%) · no payments` +
        (fund.generating ? ' · <b style="color:#ffe66d">generando…</b>' : '');
    }
  },
});
function addFeed(ev) {
  const d = document.createElement('div');
  d.className = ev.kind;
  d.textContent = ev.text;
  feed.appendChild(d);
  while (feed.children.length > 80) feed.firstChild.remove();
  feed.scrollTop = feed.scrollHeight;
}
</script>

</body>
</html>
