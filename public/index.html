<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vibe-arena — play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <header>
      <b id="game">vibe-arena</b>
      <span id="me"></span>
      <button id="not-me" type="button" hidden>Not me</button>
      <a href="/privacy.html" class="privacy-link">Privacy</a>
      <a href="/studio.html" class="studio-link"
        >Community studio · creators &amp; ideas</a
      >

      <form id="streamer">
        <input
          id="streamer-key"
          type="password"
          placeholder="Streamer key"
          aria-label="Private streamer key"
          size="12"
          autocomplete="off"
        /><button>Unlock controls</button
        ><span id="role-status" role="status"></span>
      </form>
    </header>
    <div id="rules"></div>
    <canvas id="cv"></canvas>
    <div id="seat-gate" hidden>
      <div class="seat-card" role="dialog" aria-labelledby="seat-title">
        <h2 id="seat-title">Play under your Twitch or Kick name</h2>
        <div>Type this in the stream chat:</div>
        <div class="seat-code">
          <code id="seat-code" aria-live="polite">…</code>
          <button id="seat-copy" type="button">Copy</button>
        </div>
        <div class="seat-hint">
          Only type it if this page is yours: the account that sends it plays
          here. <span id="seat-ttl"></span>
        </div>
        <button id="seat-new" type="button">New code</button>
        <div id="seat-error" role="alert"></div>
        <form id="seat-guest">
          <label for="seat-guest-name">Or play as a web guest</label>
          <input
            id="seat-guest-name"
            maxlength="20"
            required
            autocomplete="nickname"
            placeholder="Name"
          /><button>Play as guest</button>
        </form>
      </div>
    </div>
    <div id="live-credits" hidden></div>
    <div id="bar">
      <span id="players"></span>
      <span id="err"></span>
      <form id="chat">
        <input
          id="ct"
          placeholder="!command or idea"
          size="24"
          autocomplete="off"
        />
      </form>
    </div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
